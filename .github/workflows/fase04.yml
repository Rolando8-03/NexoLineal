name: Núcleo matemático
on:
  push:
    branches: [main, fase-04-algebra, fase-05-numericos, fase-06-experiencia, fase-07-visualizacion, fase-08-distribucion]
    paths: ['packages/**', 'python/**', 'modulos/**', 'teoremas/**', 'tests/**', '.github/workflows/fase04.yml', '.github/scripts/generar_catalogo.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nucleo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar núcleo y referencias independientes
        run: python -m pip install -e packages/core sympy==1.14.0 jsonschema==4.23.0
      - name: Regresiones y contratos
        run: |
          python -B pruebas.py -v
          python -B -m unittest discover -s tests -v
          python .github/scripts/generar_catalogo.py --check
          python -m tests.auditoria_matematica
          python -m tests.auditoria_fase04
          python -m tests.auditoria_fase05
          python -m tests.auditoria_fase07
          python -m compileall -q packages/core/src python modulos teoremas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexo-auditoria
          path: |
            evidencia-fase04/
            evidencia-fase05/
            evidencia-fase07/
          retention-days: 30
