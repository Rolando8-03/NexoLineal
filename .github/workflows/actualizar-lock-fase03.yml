name: Actualizar lock de fase 03
on:
  push:
    branches: [fase-03-plataformas]
    paths: [.github/workflows/actualizar-lock-fase03.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase-03-plataformas
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolver y auditar versiones corregidas
        working-directory: apps/frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --audit-level=low
      - name: Registrar lock
        run: |
          git config user.name 'Rolando Mayorga'
          git config user.email 'remena@uamv.edu.ni'
          git add apps/frontend/package-lock.json
          git diff --cached --quiet || git commit -m "build: actualiza lock con correcciones de Vite y KaTeX"
          git push origin HEAD:fase-03-plataformas
