name: Preparar dependencias de fase 03
on:
  push:
    branches: [fase-03-plataformas]
    paths: [.github/workflows/preparar-fase03.yml]
permissions:
  contents: write
jobs:
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase-03-plataformas
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fijar árbol npm
        working-directory: apps/frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Crear Gradle Wrapper aislado del proyecto Android
        run: |
          mkdir -p /tmp/nexolineal-wrapper
          touch /tmp/nexolineal-wrapper/settings.gradle
          gradle -p /tmp/nexolineal-wrapper wrapper --gradle-version 8.11.1 --distribution-type bin
          cp /tmp/nexolineal-wrapper/gradlew apps/android/
          cp /tmp/nexolineal-wrapper/gradlew.bat apps/android/
          cp -r /tmp/nexolineal-wrapper/gradle apps/android/
          curl --fail --silent --show-error https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256 -o /tmp/nexolineal-gradle.sha256
          printf '\ndistributionSha256Sum=%s\n' "$(cat /tmp/nexolineal-gradle.sha256)" >> apps/android/gradle/wrapper/gradle-wrapper.properties
          chmod +x apps/android/gradlew
      - name: Registrar dependencias reproducibles con la autoría del propietario
        run: |
          git config user.name 'Rolando Mayorga'
          git config user.email 'remena@uamv.edu.ni'
          git add apps/frontend/package-lock.json apps/android/gradlew apps/android/gradlew.bat apps/android/gradle
          git diff --cached --quiet || git commit -m "build: fija dependencias npm y Gradle Wrapper con checksum"
          git push origin HEAD:fase-03-plataformas
