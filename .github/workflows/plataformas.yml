name: NexoLineal multiplataforma
on:
  push:
    branches: [main, fase-03-plataformas, fase-04-algebra, fase-05-numericos, fase-06-experiencia]
    paths:
      - 'apps/**'
      - 'packages/core/**'
      - 'tests/**'
      - 'packages/contracts/**'
      - '.github/scripts/generar_catalogo.py'
      - '.github/scripts/*fase06*'
      - 'tests/fixtures/platform_contracts.json'
      - '.github/scripts/*fase03*'
      - '.github/scripts/casos_plataformas.py'
      - '.github/workflows/plataformas.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plataformas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Verificar núcleo y regresiones
        run: |
          python -m pip install -e packages/core sympy==1.14.0 jsonschema==4.23.0
          python -B pruebas.py -v
          python -B -m unittest discover -s tests -v
          python .github/scripts/generar_catalogo.py --check
          python -m tests.auditoria_matematica
          python -m tests.auditoria_fase04
          python -m tests.auditoria_fase05
          python .github/scripts/casos_plataformas.py
      - name: Compilar web con Python local
        working-directory: apps/frontend
        run: |
          npm ci
          npm audit --audit-level=low
          npm run build
      - name: Instalar navegador de verificación
        run: |
          npm install --prefix /tmp/nexo-playwright playwright@1.56.1 axe-core@4.10.3
          /tmp/nexo-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Probar Worker real y experiencia compartida
        env:
          NODE_PATH: /tmp/nexo-playwright/node_modules
        run: |
          node .github/scripts/probar_estado_fase06.cjs
          node .github/scripts/probar_web_fase03.cjs
          node .github/scripts/probar_experiencia_fase06.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fase03-web
          path: |
            evidencia-fase03/
            evidencia-fase04/
            evidencia-fase05/
            evidencia-fase06/
            apps/frontend/dist/
          retention-days: 30
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Instalar Python y WebView2
        shell: pwsh
        run: |
          python -m pip install -e packages/core -r apps/windows/requirements.txt
          $runtime = "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application"
          if (-not (Test-Path $runtime)) {
            choco install webview2-runtime --yes --no-progress
            if ($LASTEXITCODE -notin @(0, 3010)) { throw 'Falló WebView2' }
          }
      - name: Compilar interfaz Windows
        working-directory: apps/frontend
        env:
          VITE_TARGET: windows
        run: |
          npm ci
          npm run build
      - name: Probar ventana con Python nativo
        shell: pwsh
        run: |
          python .github/scripts/casos_plataformas.py
          $env:NEXO_FIXTURES = "$pwd/tests/fixtures/platform_contracts.json"
          $env:NEXO_EVIDENCE = "$pwd/evidencia-fase03/windows-fuente.json"
          $env:NEXO_STATE_FILE = "$pwd/evidencia-fase03/windows-fuente-project.json"
          python -m apps.windows.main --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Falló ventana nativa' }
          $env:NEXO_EVIDENCE = "$pwd/evidencia-fase03/windows-fuente-reabrir.json"
          python -m apps.windows.main --self-test --restore-test
          if ($LASTEXITCODE -ne 0) { throw 'Falló reapertura de ventana nativa' }
      - name: Empaquetar ejecutable gráfico
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --name NexoLineal-Prototipo --icon assets/icono.ico --add-data "apps/frontend/dist;ui" --collect-submodules nexolineal --hidden-import apps.windows.main --hidden-import apps.windows.smoke --paths . apps/windows/entrypoint.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló empaquetado' }
          python -c "import pefile; p=pefile.PE('dist/NexoLineal-Prototipo.exe'); assert p.OPTIONAL_HEADER.Subsystem == 2"
      - name: Ejecutar aplicación empaquetada
        shell: pwsh
        run: |
          $env:NEXO_FIXTURES = "$pwd/tests/fixtures/platform_contracts.json"
          $env:NEXO_EVIDENCE = "$pwd/evidencia-fase03/windows-exe.json"
          $env:NEXO_STATE_FILE = "$pwd/evidencia-fase03/windows-exe-project.json"
          $process = Start-Process -FilePath "$pwd/dist/NexoLineal-Prototipo.exe" -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(120000)) {
            Get-ChildItem evidencia-fase03 | Format-Table
            if (Test-Path evidencia-fase03/windows-exe.json) { Get-Content evidencia-fase03/windows-exe.json }
            if (Test-Path evidencia-fase03/windows-exe.json.threads.log) { Get-Content evidencia-fase03/windows-exe.json.threads.log }
            if (Test-Path evidencia-fase03/windows-exe.json.error.log) { Get-Content evidencia-fase03/windows-exe.json.error.log }
            Stop-Process -Id $process.Id -Force
            throw 'El ejecutable excedió dos minutos'
          }
          if (Test-Path evidencia-fase03/windows-exe.json.error.log) { Get-Content evidencia-fase03/windows-exe.json.error.log; throw 'Excepción de ejecución gráfica' }
          if ($process.ExitCode -ne 0) { throw 'Falló ejecutable gráfico' }
          if (-not (Test-Path $env:NEXO_EVIDENCE)) { throw 'Falta evidencia del ejecutable' }
          python -c "import json,os; from pathlib import Path; print('NEXO_WINDOWS_EXE_REPORT='+json.dumps(json.loads(Path(os.environ['NEXO_EVIDENCE']).read_text(encoding='utf-8')),ensure_ascii=False))"
          $env:NEXO_EVIDENCE = "$pwd/evidencia-fase03/windows-exe-reabrir.json"
          $reopen = Start-Process -FilePath "$pwd/dist/NexoLineal-Prototipo.exe" -ArgumentList '--self-test','--restore-test' -PassThru
          if (-not $reopen.WaitForExit(120000)) { Stop-Process -Id $reopen.Id -Force; throw 'La reapertura excedió dos minutos' }
          if ($reopen.ExitCode -ne 0) { Get-Content $env:NEXO_EVIDENCE; throw 'Falló reapertura del EXE' }
          python -c "import json,os; from pathlib import Path; r=json.loads(Path(os.environ['NEXO_EVIDENCE']).read_text(encoding='utf-8')); print('NEXO_WINDOWS_REOPEN_REPORT='+json.dumps(r,ensure_ascii=False)); assert r['approved']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fase03-windows
          path: |
            evidencia-fase03/
            dist/NexoLineal-Prototipo.exe
          retention-days: 30
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Compilar interfaz y preparar Python incluido
        run: |
          python -m pip install -e packages/core
          python .github/scripts/casos_plataformas.py
          cd apps/frontend
          npm ci
          VITE_TARGET=android npm run build
          cd ../..
          python apps/android/prepare.py
          chmod +x apps/android/gradlew
      - name: Construir APK y prueba instrumentada
        run: apps/android/gradlew -p apps/android assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar APK sin conexión
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb install -r -t apps/android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w org.nexolineal.app.test/androidx.test.runner.AndroidJUnitRunner > evidencia-fase03/instrumentacion-android.log
            cat evidencia-fase03/instrumentacion-android.log
            adb exec-out run-as org.nexolineal.app cat files/fase03-android.json > evidencia-fase03/android.json
            adb exec-out run-as org.nexolineal.app cat files/fase03-android.png > evidencia-fase03/android.png
            python -c "from pathlib import Path; import json; p=Path('evidencia-fase03/android.json'); r=json.loads(p.read_text()); print('NEXO_ANDROID_REPORT='+json.dumps(r,ensure_ascii=False)); assert r['approved']"
      - name: Comprobar contenido y tamaño del APK
        run: |
          python -c "from pathlib import Path; from zipfile import ZipFile; p=Path('apps/android/app/build/outputs/apk/debug/app-debug.apk'); z=ZipFile(p); a=['arm64-v8a','x86_64']; assert all('lib/'+abi+'/libpython3.12.so' in z.namelist() for abi in a); print({'apk_bytes':p.stat().st_size,'abis':a})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fase03-android
          path: |
            evidencia-fase03/
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/androidTest-results/
          retention-days: 30
  paridad:
    needs: [web, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: fase03-*
          path: resultados
      - name: Comparar contratos completos y código Python
        run: python .github/scripts/paridad_fase03.py resultados
      - uses: actions/upload-artifact@v4
        with:
          name: fase03-paridad
          path: resultados/paridad.json
          retention-days: 30
