plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.chaquo.python"
}
android {
    namespace "org.nexolineal.app"
    compileSdk 35
    defaultConfig {
        applicationId "org.nexolineal.app"
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "0.8.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters "arm64-v8a", "x86_64" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = "21" }
    if (System.getenv("NEXO_TEST_RELEASE")) testBuildType "release"
    signingConfigs {
        ownerRelease {
            def keyPath = System.getenv("NEXO_KEYSTORE")
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv("NEXO_STORE_PASSWORD")
                keyAlias System.getenv("NEXO_KEY_ALIAS")
                keyPassword System.getenv("NEXO_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            minifyEnabled false
            if (System.getenv("NEXO_KEYSTORE")) signingConfig signingConfigs.ownerRelease
        }
    }
}
chaquopy {
    defaultConfig { version = "3.12" }
    sourceSets {
        getByName("main") { srcDir("../../../packages/core/src") }
    }
}
dependencies {
    implementation project(":capacitor-android")
    implementation "androidx.appcompat:appcompat:1.7.0"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
}
