name: Publicar calculadora en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  UV_PYTHON: 3.12
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: Construir aplicación web
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar uv
        uses: astral-sh/setup-uv@v6

      - name: Construir aplicación Flet
        shell: bash
        run: |
          uv run flet build web \
            --yes \
            --verbose \
            --base-url "${GITHUB_REPOSITORY#*/}" \
            --route-url-strategy hash

      - name: Preparar archivos para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
          name: web-build-artifact

  deploy:
    name: Publicar página
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Desplegar aplicación
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: web-build-artifact